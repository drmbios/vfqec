[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "vfqec"
version = "0.1.0"
description = "Syndrome-only virtual-field quantum error-correction experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.6", "scipy==1.16.3", "qiskit==2.1.2", "qiskit-aer==0.17.2",
  "pymatching==2.3.1", "optuna==4.4.0", "pydantic==2.11.7",
  "fastapi==0.142.2", "starlette==1.3.1", "uvicorn==0.35.0", "streamlit==1.54.0", "pillow==12.3.0",
  "SQLAlchemy==2.0.42", "psycopg[binary]==3.2.9", "redis==6.2.0", "rq==2.4.1",
  "httpx==0.28.1", "matplotlib==3.10.5", "pandas==3.0.6", "reportlab==4.4.3",
  "python-dotenv==1.2.2", "bluequbit==0.18.12b1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.12.7"]

[project.scripts]
vfqec = "vfqec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
