name: tests-and-image
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q
        env:
          LLM_PROVIDER: none
          OPENBLAS_NUM_THREADS: '1'
      - run: vfqec run E1 --backend local --quick
      - run: docker build --target runtime -t vfqec:ci .
      - run: docker run --rm --entrypoint python vfqec:ci -m pip check
