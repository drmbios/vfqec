name: GitHub Pages demo
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_demo.py'
      - 'benchmarks/E1-bluequbit/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build verified static demo
        run: python scripts/build_demo.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
